# Render Blueprint for HariCart — one web service that serves the website AND the API.
# Render → New → Blueprint → pick this repository. Fill in the values marked "sync: false".
# Full steps: docs/go-live.md
services:
  - type: web
    name: haricart
    runtime: node
    # Singapore is closest to India and to the TiDB ap-southeast-1 database.
    region: singapore
    # "starter" (~$7/month) never sleeps. "free" sleeps after 15 idle minutes, so the
    # first customer then waits about a minute and the order alarm can miss orders.
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # Signs login sessions. Render creates a long random value for you.
      - key: JWT_SECRET
        generateValue: true
      # mysql://USER:PASSWORD@gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/haricart
      - key: DATABASE_URL
        sync: false
      # Your mobile number(s), comma separated. They become the owner/admin.
      - key: OWNER_PHONES
        sync: false
      # Private Owner ID for the owner screens.
      - key: OWNER_SECRET_ID
        sync: false
      # Real SMS OTP (required: the test code 1234 does not work on the live site).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Your live address, e.g. https://haricart.onrender.com (used in share links and QR codes).
      - key: VITE_PUBLIC_SITE_URL
        sync: false
      # Optional: SMS to the owner for every new order (Twilio).
      - key: OWNER_ALERT_PHONE
        sync: false
